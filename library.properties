name=ThingsLinker
version=2.2.0
author=ThingsLinker Team
maintainer=ThingsLinker <info@thingslinker.com>
sentence=Connect ESP32 to the ThingsLinker IoT platform in 3 lines of code.
paragraph=Features automatic BLE WiFi provisioning, TLS MQTT, NTP-synced telemetry timestamps, auto-reconnect, optional offline storage of readings while disconnected, persistent key-value storage, 125 virtual pins (V0–V124), and OTA firmware updates. Includes ThingsLinkerGSM class for 4G LTE modems — SIMCom A7672/SIM7672 and Quectel EC200A, found automatically — using the modem's own MQTT AT commands (no TinyGSM required). Supports ESP32. Requires: ArduinoJson, PubSubClient.
category=Communication
url=https://github.com/Thingslinker-Organization/ThingsLinker-Arduino-Library
architectures=esp32
depends=ArduinoJson (>=7.4.3),PubSubClient
includes=ThingsLinker.h
